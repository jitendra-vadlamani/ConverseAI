# Backing services for the integration tests (go test -tags=integration ./internal/e2e/).
# Ports are bound to localhost only; nothing here is meant for production.
services:
  mongo:
    image: mongo:8.0.15
    ports: ["127.0.0.1:27019:27017"]
    tmpfs: [/data/db]
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ciuser
      MINIO_ROOT_PASSWORD: ci-password-123
    ports: ["127.0.0.1:19000:9000"]
    tmpfs: [/data]
  chroma:
    image: chromadb/chroma:1.3.5
    ports: ["127.0.0.1:18000:8000"]
