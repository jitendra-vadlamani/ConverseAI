services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  web:
    build: .
    container_name: ai-chat-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=ai_chat
      - JWT_SECRET=your-secret-key-change-me
    depends_on:
      - mongodb

volumes:
  mongodb_data:
