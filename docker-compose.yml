services:
  converseai-db:
    image: mongo:latest
    container_name: converseai-db
    networks:
      - converseai-net
    ports:
      - "${HOST_PORT_DB:-27018}:27017"
    volumes:
      - converseai_db_data:/data/db
    restart: always

  minio:
    image: minio/minio:latest
    container_name: converseai-storage
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - converseai_storage_data:/data
    networks:
      - converseai-net
    restart: always

  chromadb:
    image: chromadb/chroma:latest
    container_name: converseai-vector
    volumes:
      - converseai_vector_data:/index_data
    ports:
      - "8000:8000"
    networks:
      - converseai-net
    restart: always

  converseai:
    build: .
    container_name: converseai
    ports:
      - "${HOST_PORT_APP:-8080}:8080"
    environment:
      - PORT=8080
      - MONGO_URI=${MONGO_URI:-mongodb://converseai-db:27017}
      - DB_NAME=${DB_NAME:-ai_chat}
      - JWT_SECRET=${JWT_SECRET}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
      - MINIO_BUCKET=${MINIO_BUCKET:-converseai}
      - MINIO_USE_SSL=false
      - CHROMA_URL=${CHROMA_URL:-http://chromadb:8000}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - DEFAULT_PLANNER_MODEL=${DEFAULT_PLANNER_MODEL}
      - DEFAULT_CHAT_MODEL=${DEFAULT_CHAT_MODEL}
      - DEFAULT_OCR_MODEL=${DEFAULT_OCR_MODEL}
      - DEFAULT_VISION_MODEL=${DEFAULT_VISION_MODEL}
      - DEFAULT_CODING_MODEL=${DEFAULT_CODING_MODEL}
      - DEFAULT_TRANSLATION_MODEL=${DEFAULT_TRANSLATION_MODEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - converseai-net
    depends_on:
      - converseai-db
      - minio
      - chromadb

networks:
  converseai-net:
    driver: bridge

volumes:
  converseai_db_data:
  converseai_storage_data:
  converseai_vector_data:
