services:
  converseai-db:
    image: mongo:latest
    container_name: converseai-db
    networks:
      - converseai-net
    volumes:
      - converseai_db_data:/data/db
    # Removed host port mapping to avoid conflicts and improve security

  converseai:
    build: .
    container_name: converseai
    ports:
      - "${HOST_PORT_APP:-8080}:8080"
    environment:
      - PORT=8080
      - MONGO_URI=${MONGO_URI:-mongodb://converseai-db:27017}
      - DB_NAME=${DB_NAME:-ai_chat}
      - JWT_SECRET=${JWT_SECRET}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - converseai-net
    depends_on:
      - converseai-db

networks:
  converseai-net:
    driver: bridge

volumes:
  converseai_db_data:
