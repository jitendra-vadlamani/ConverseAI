services:

  converseai-pg:
    image: postgres:15
    container_name: converseai-pg
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=converseai
    ports:
      - "5432:5432"
    volumes:
      - converseai_pg_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - converseai-net
    restart: always

  converseai:
    build: .
    container_name: converseai
    ports:
      - "${HOST_PORT_APP:-8080}:8080"
    environment:
      - PORT=8080
      - POSTGRES_URI=${POSTGRES_URI:-postgres://postgres:postgres@converseai-pg:5432/converseai?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - DEFAULT_PLANNER_MODEL=${DEFAULT_PLANNER_MODEL}
      - DEFAULT_CHAT_MODEL=${DEFAULT_CHAT_MODEL}
      - DEFAULT_OCR_MODEL=${DEFAULT_OCR_MODEL}
      - DEFAULT_VISION_MODEL=${DEFAULT_VISION_MODEL}
      - DEFAULT_CODING_MODEL=${DEFAULT_CODING_MODEL}
      - DEFAULT_TRANSLATION_MODEL=${DEFAULT_TRANSLATION_MODEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - converseai-net
    depends_on:
      - converseai-pg

networks:
  converseai-net:
    driver: bridge

volumes:
  converseai_pg_data:
